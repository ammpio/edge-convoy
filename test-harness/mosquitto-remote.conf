# Mosquitto configuration for REMOTE broker (TLS + auth)

# TLS listener
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false

# Non-TLS listener for testing (still requires auth)
listener 1884
protocol mqtt

# Authentication (applies to all listeners)
allow_anonymous false
password_file /mosquitto/config/passwd

# Disable persistence for testing
persistence false

# Logging
log_dest stdout
log_type all
